spec:
  name: oyster
  services:
    - name: oyster
      image:
        registry_type: DOCKER_HUB
        registry: sergeikireevdev
        repository: oyster
        tag: digitalocean
      http_port: 4000
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-2gb
      envs:
        - key: PI_DIR
          scope: RUN_TIME
          value: /workspace
        - key: OYSTER_TOKEN
          scope: RUN_TIME
          type: SECRET
      health_check:
        initial_delay_seconds: 10
        period_seconds: 10
        timeout_seconds: 5
        success_threshold: 1
        failure_threshold: 6
        http_path: /health
        port: 4000
