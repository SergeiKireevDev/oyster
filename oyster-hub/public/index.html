<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Oyster Hub</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #edf7f4; background: #071311; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 10% -10%, #17483f 0, transparent 34rem), #071311; }
    header, main { width: min(1120px, calc(100% - 32px)); margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 34px 0 28px; }
    h1 { font-size: clamp(1.7rem, 4vw, 2.6rem); margin: 0; letter-spacing: -.04em; }
    h1 span, .eyebrow { color: #78e6c3; }
    .eyebrow { letter-spacing: .16em; text-transform: uppercase; font-size: .72rem; font-weight: 800; margin-bottom: 7px; }
    button { border: 1px solid #397165; color: #eafff8; background: #10251f; border-radius: 10px; padding: 10px 15px; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #18362e; }
    button:disabled { opacity: .55; cursor: wait; }
    .actions, .workspace-actions { display: flex; gap: 8px; }
    .workspace-actions button { padding: 6px 9px; font-size: .72rem; }
    .danger { border-color: #70413d; color: #ffaaa2; }
    .primary { background: #61d9b3; border-color: #61d9b3; color: #062019; }
    .primary:hover { background: #83e5c7; }
    .notice { border: 1px solid #694947; background: #251716; color: #ffc9c3; padding: 14px 16px; border-radius: 12px; margin-bottom: 20px; }
    .hidden { display: none; }
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 24px; }
    .metric { background: #0d201b; border: 1px solid #1f4038; border-radius: 14px; padding: 15px; }
    .metric strong { display: block; font-size: 1.75rem; letter-spacing: -.05em; }
    .metric span { display: block; margin-top: 4px; color: #8dafaa; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; }
    .section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 0 12px; }
    .section-title h2 { margin: 0; font-size: 1.1rem; }
    #updated { color: #718e88; font-size: .8rem; }
    .environments { display: grid; gap: 16px; padding-bottom: 40px; }
    .environment { background: #091b17; border: 1px solid #1f4038; border-radius: 18px; padding: 18px; }
    .environment-head { display: flex; justify-content: space-between; gap: 16px; align-items: start; margin-bottom: 14px; }
    .environment h3 { margin: 0; font-size: 1.15rem; }
    .environment-meta, .url { margin-top: 4px; color: #73978f; font: .75rem ui-monospace, monospace; overflow-wrap: anywhere; }
    .workspaces { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .workspace { background: linear-gradient(145deg, #10241f, #0b1b17); border: 1px solid #234a40; border-radius: 14px; padding: 16px; }
    .workspace-head { display: flex; align-items: start; justify-content: space-between; gap: 15px; }
    .workspace h4 { margin: 0; font-size: 1rem; }
    .status { display: inline-flex; align-items: center; gap: 6px; color: #9ab8b1; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #ff786d; box-shadow: 0 0 10px #ff786d66; }
    .status.online::before { background: #5be3ae; box-shadow: 0 0 10px #5be3ae66; }
    .status.provisioning::before, .status.awaiting_agent::before, .status.initializing::before, .status.resuming::before { background: #ffc65c; box-shadow: 0 0 10px #ffc65c66; }
    .resource-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
    .resource { border-top: 1px solid #23433b; padding-top: 10px; }
    .resource strong { display: block; font-size: 1.05rem; }
    .resource span { color: #73978f; font-size: .7rem; text-transform: uppercase; }
    .workspace-footer { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-top: 14px; }
    .provider { color: #73978f; font-size: .72rem; }
    .errors { margin: 14px 0 0; color: #ff9f96; font-size: .78rem; }
    .empty { color: #73978f; margin: 4px 0; }
    footer { color: #58736d; font-size: .75rem; padding: 0 0 30px; }
    dialog { width: min(460px, calc(100% - 28px)); color: #edf7f4; background: #0d201b; border: 1px solid #397165; border-radius: 16px; padding: 22px; box-shadow: 0 24px 80px #000a; }
    dialog::backdrop { background: #020907cc; backdrop-filter: blur(4px); }
    dialog h2 { margin: 0 0 8px; }
    dialog > p { margin: 0 0 18px; color: #8dafaa; font-size: .85rem; }
    form { display: grid; gap: 13px; }
    label { display: grid; gap: 6px; color: #9ab8b1; font-size: .78rem; font-weight: 700; }
    input, select { width: 100%; border: 1px solid #31594f; border-radius: 9px; padding: 10px 11px; color: #edf7f4; background: #071612; font: inherit; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .form-error { color: #ff9f96; font-size: .8rem; min-height: 1em; }
    code { color: #91d8c3; }
    @media (max-width: 800px) { .metrics { grid-template-columns: repeat(3, 1fr); } .workspaces { grid-template-columns: 1fr; } }
    @media (max-width: 480px) { header { align-items: end; } .metrics { grid-template-columns: repeat(2, 1fr); } .resource-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <header>
    <div><div class="eyebrow">Connection overview</div><h1>Oyster <span>Hub</span></h1></div>
    <div class="actions"><button id="refresh" type="button">Refresh</button><button id="new-workspace" class="primary" type="button" hidden>New llmbox workspace</button></div>
  </header>
  <main>
    <div id="notice" class="notice hidden"></div>
    <section id="metrics" class="metrics" aria-label="Fleet totals"></section>
    <div class="section-title"><h2>Environments and workspaces</h2><span id="updated"></span></div>
    <section id="environments" class="environments"></section>
    <footer>An environment is a Hub connection boundary. Each environment contains one or more workspaces. Workspace API: <code>/api/v1/workspaces/{wid}/…</code></footer>
  </main>
  <dialog id="create-dialog">
    <h2>New llmbox workspace</h2>
    <p>Choose the spoke environment where llmbox should create the box.</p>
    <form id="create-form">
      <label>Environment<select id="spoke" name="spoke" required></select></label>
      <label>Workspace ID<input name="id" required pattern="[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?" placeholder="refactor-auth"></label>
      <label>Display name<input name="name" maxlength="500" placeholder="Optional description"></label>
      <label>Disk size (GiB)<input name="diskGiB" type="number" min="1" step="1" placeholder="Spoke default"></label>
      <div id="form-error" class="form-error"></div>
      <div class="form-actions"><button id="cancel-create" type="button">Cancel</button><button id="submit-create" class="primary" type="submit">Create workspace</button></div>
    </form>
  </dialog>
  <script type="module">
    const token = new URLSearchParams(location.hash.slice(1)).get("token") || sessionStorage.getItem("oyster-hub-token") || "";
    if (token) sessionStorage.setItem("oyster-hub-token", token);
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    const $ = (id) => document.getElementById(id);
    const authHeaders = () => ({ authorization: `Bearer ${token}` });
    const labels = [
      ["environmentCount", "environments"], ["workspaceCount", "workspaces"],
      ["online", "online"], ["provisioning", "provisioning"], ["offline", "offline"],
      ["runningRunners", "running agents"], ["sessions", "sessions"], ["openHublots", "open hublots"],
    ];
    const resourceCount = (workspace, resource, key) => workspace.results?.[resource]?.[key]?.length ?? "—";
    function element(name, className, text) {
      const node = document.createElement(name); if (className) node.className = className; if (text != null) node.textContent = text; return node;
    }
    function statusNode(status, suffix = "") { return element("span", `status ${status}`, `${status.replaceAll("_", " ")}${suffix}`); }
    function workspaceCard(workspace) {
      const card = element("article", "workspace");
      const head = element("div", "workspace-head");
      const identity = element("div"); identity.append(element("h4", "", workspace.name), element("div", "url", workspace.url || "Awaiting Oyster endpoint"));
      const latency = workspace.latencyMs == null ? "" : ` · ${workspace.latencyMs}ms`;
      head.append(identity, statusNode(workspace.status, latency));
      const resources = element("div", "resource-grid");
      [["runners", "runners", "agents"], ["sessions", "sessions", "sessions"], ["routines", "routines", "routines"], ["tunnels", "tunnels", "hublots"]].forEach(([resource, key, label]) => {
        const item = element("div", "resource"); item.append(element("strong", "", resourceCount(workspace, resource, key)), element("span", "", label)); resources.append(item);
      });
      card.append(head, resources);
      const footer = element("div", "workspace-footer");
      footer.append(element("span", "provider", workspace.provider?.type === "cloud" ? `${workspace.provider.name || workspace.provider.id} · ${workspace.provider.instanceId || "VM"}` : workspace.provider?.type || "direct"));
      if (["cloud", "llmbox"].includes(workspace.provider?.type)) {
        const actions = element("div", "workspace-actions");
        const pause = element("button", "", workspace.status === "paused" ? "Resume" : "Pause");
        pause.type = "button"; pause.disabled = ["provisioning", "awaiting_agent", "initializing", "resuming", "pausing", "destroying"].includes(workspace.status);
        pause.addEventListener("click", () => manageWorkspace(workspace, workspace.status === "paused" ? "resume" : "pause"));
        const destroy = element("button", "danger", "Destroy"); destroy.type = "button";
        destroy.addEventListener("click", () => manageWorkspace(workspace, "destroy"));
        actions.append(pause, destroy); footer.append(actions);
      }
      card.append(footer);
      if (workspace.errors) card.append(element("p", "errors", Object.entries(workspace.errors).map(([key, value]) => `${key}: ${value}`).join(" · ")));
      return card;
    }
    function render(overview, environments) {
      const llmboxEnvironments = environments.filter((environment) => environment.kind === "llmbox");
      $("new-workspace").hidden = overview.driver?.capabilities?.create !== true || !llmboxEnvironments.length;
      $("spoke").replaceChildren(...llmboxEnvironments.map((environment) => {
        const option = element("option", "", environment.name); option.value = environment.spoke || environment.id; return option;
      }));
      const totals = { ...overview.totals, environmentCount: environments.length, workspaceCount: overview.workspaces.length };
      $("metrics").replaceChildren(...labels.map(([key, label]) => {
        const card = element("div", "metric"); card.append(element("strong", "", totals[key] ?? 0), element("span", "", label)); return card;
      }));
      const sections = environments.map((environment) => {
        const section = element("section", "environment");
        const head = element("div", "environment-head");
        const identity = element("div"); identity.append(element("h3", "", environment.name), element("div", "environment-meta", `${environment.kind} · ${environment.id}`));
        head.append(identity, statusNode(environment.status)); section.append(head);
        const workspaces = overview.workspaces.filter((workspace) => workspace.environmentId === environment.id);
        if (workspaces.length) {
          const grid = element("div", "workspaces"); grid.append(...workspaces.map(workspaceCard)); section.append(grid);
        } else section.append(element("p", "empty", "No workspaces in this environment."));
        return section;
      });
      $("environments").replaceChildren(...sections);
      $("updated").textContent = `Updated ${new Date(overview.generatedAt).toLocaleTimeString()}`;
    }
    async function request(path, init = {}) {
      const response = await fetch(path, { ...init, headers: { ...authHeaders(), ...(init.headers || {}) } });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
      return data;
    }
    async function refresh() {
      $("refresh").disabled = true; $("notice").classList.add("hidden");
      try {
        if (!token) throw new Error("Missing hub token. Open this page with #token=YOUR_HUB_TOKEN once.");
        const [overview, catalog] = await Promise.all([request("/api/v1/overview"), request("/api/v1/environments")]);
        render(overview, catalog.environments || []);
      } catch (error) { $("notice").textContent = error.message; $("notice").classList.remove("hidden"); }
      finally { $("refresh").disabled = false; }
    }
    async function manageWorkspace(workspace, action) {
      const kind = workspace.provider?.type === "llmbox" ? "llmbox VM" : "provider VM";
      const warning = action === "destroy" ? `Destroy “${workspace.name}” and its ${kind} permanently?` : `${action === "pause" ? "Pause" : "Resume"} “${workspace.name}”?`;
      if (!confirm(warning)) return;
      try {
        if (action === "destroy") await request(`/api/v1/workspaces/${encodeURIComponent(workspace.id)}`, { method: "DELETE" });
        else await request(`/api/v1/workspaces/${encodeURIComponent(workspace.id)}/actions`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action }) });
        await refresh();
      } catch (error) { $("notice").textContent = error.message; $("notice").classList.remove("hidden"); }
    }
    $("refresh").addEventListener("click", refresh);
    $("new-workspace").addEventListener("click", () => $("create-dialog").showModal());
    $("cancel-create").addEventListener("click", () => $("create-dialog").close());
    $("create-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      const diskGiB = Number(form.get("diskGiB") || 0);
      const payload = { id: form.get("id"), name: form.get("name"), spoke: form.get("spoke") };
      if (diskGiB > 0) payload.diskBytes = diskGiB * 1024 * 1024 * 1024;
      $("submit-create").disabled = true; $("form-error").textContent = "";
      try {
        const data = await request("/api/v1/workspaces", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
        event.currentTarget.reset(); $("create-dialog").close(); await refresh();
        if (data.workspace?.warning) { $("notice").textContent = data.workspace.warning; $("notice").classList.remove("hidden"); }
      } catch (error) { $("form-error").textContent = error.message; }
      finally { $("submit-create").disabled = false; }
    });
    refresh();
  </script>
</body>
</html>
