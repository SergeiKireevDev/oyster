AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege cross-account role used by Oyster Hub to manage tagged EC2 development environments.
Parameters:
  HubPrincipalArn:
    Type: String
    Description: AWS principal operated by Oyster Hub.
  ExternalId:
    Type: String
    NoEcho: true
    Description: One-time confused-deputy protection generated by Oyster Hub.
  RoleName:
    Type: String
    Default: OysterHubRole
Resources:
  OysterHubRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Allows Oyster Hub to provision and manage only Oyster-tagged EC2 instances.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref HubPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: OysterEc2Provisioning
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DiscoverEc2Catalog
                Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - ec2:DescribeImages
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeInstanceTypeOfferings
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                Resource: "*"
              - Sid: LaunchTaggedInstances
                Effect: Allow
                Action: ec2:RunInstances
                Resource:
                  - arn:aws:ec2:*::image/*
                  - arn:aws:ec2:*:*:subnet/*
                  - arn:aws:ec2:*:*:security-group/*
                  - arn:aws:ec2:*:*:network-interface/*
                  - arn:aws:ec2:*:*:key-pair/*
                  - arn:aws:ec2:*:*:volume/*
                  - arn:aws:ec2:*:*:instance/*
                Condition:
                  StringEquals:
                    aws:RequestTag/oyster:managed-by: oyster-hub
              - Sid: TagDuringLaunch
                Effect: Allow
                Action: ec2:CreateTags
                Resource:
                  - arn:aws:ec2:*:*:instance/*
                  - arn:aws:ec2:*:*:volume/*
                Condition:
                  StringEquals:
                    ec2:CreateAction: RunInstances
                    aws:RequestTag/oyster:managed-by: oyster-hub
              - Sid: ManageOnlyOysterInstances
                Effect: Allow
                Action:
                  - ec2:StartInstances
                  - ec2:StopInstances
                  - ec2:TerminateInstances
                Resource: arn:aws:ec2:*:*:instance/*
                Condition:
                  StringEquals:
                    ec2:ResourceTag/oyster:managed-by: oyster-hub
Outputs:
  RoleArn:
    Description: Role assumed by Oyster Hub.
    Value: !GetAtt OysterHubRole.Arn
