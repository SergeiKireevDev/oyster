name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pi/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix pi --ignore-scripts

      - name: Build bundled pi
        run: npm run build:pi

      - name: Build frontend
        run: npm run build

      - name: Run test suite
        run: npm test

      - name: Build documentation
        run: npm run docs:build

  container-e2e:
    name: Container and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve bundled pi revision
        id: pi-revision
        run: echo "revision=$(git -C pi rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build SQLite E2E image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.local-pi
          build-contexts: |
            pi-source=./pi
          build-args: |
            PI_LOCAL_REV=${{ steps.pi-revision.outputs.revision }}
          load: true
          tags: |
            oyster:sqlite
            docker.io/sergeikireevdev/oyster:digitalocean
            docker.io/sergeikireevdev/oyster:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json

      - name: Install Hub and frontend dependencies
        run: npm ci

      - name: Build Hub frontend
        run: npm run build

      - name: Install browser test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run complete browser test suite
        working-directory: tests/e2e
        run: npx playwright test

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish tested deployment image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "docker.io/sergeikireevdev/oyster:sha-${GITHUB_SHA}"
          docker push "docker.io/sergeikireevdev/oyster:digitalocean"

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
