<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --paper: #fff;
      --text: #24292f;
      --muted: #57606a;
      --border: #d0d7de;
      --accent: #0969da;
      --code: #f0f2f4;
      --quote: #d0d7de;
      font: 17px/1.7 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --paper: #161b22;
        --text: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --accent: #58a6ff;
        --code: #0d1117;
        --quote: #3b434b;
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--text); background: var(--bg); }
    .page {
      width: min(100% - 2rem, 880px);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 5rem) clamp(1.25rem, 6vw, 5rem);
      background: var(--paper);
      box-shadow: 0 0 35px rgb(0 0 0 / 8%);
    }
    [hidden] { display: none !important; }
    .reader-bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 2.5rem; }
    .source { color: var(--muted); font-size: .82rem; }
    .reader-actions { display: flex; gap: .5rem; flex-shrink: 0; }
    .reader-actions button {
      padding: .4rem .7rem;
      color: var(--text);
      background: var(--code);
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      font-size: .78rem;
      line-height: 1.3;
      cursor: pointer;
    }
    .reader-actions button:hover { color: var(--accent); border-color: var(--accent); }
    .reader-actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    article { overflow-wrap: break-word; }
    .raw-view pre { min-height: 60vh; white-space: pre-wrap; overflow-wrap: break-word; }
    .raw-view code { font-size: .82rem; }
    h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 2em 0 .7em; scroll-margin-top: 1rem; }
    h1 { margin-top: 0; font-size: clamp(2rem, 7vw, 3.2rem); letter-spacing: -.035em; }
    h2 { padding-bottom: .25em; border-bottom: 1px solid var(--border); }
    h3 { font-size: 1.25rem; }
    p, ul, ol, blockquote, pre, table { margin: 0 0 1.25rem; }
    a { color: var(--accent); text-underline-offset: .18em; }
    a:hover { text-decoration-thickness: 2px; }
    .anchor { margin-left: .4em; opacity: 0; font-weight: 400; text-decoration: none; }
    h1:hover .anchor, h2:hover .anchor, h3:hover .anchor,
    h4:hover .anchor, h5:hover .anchor, h6:hover .anchor, .anchor:focus { opacity: 1; }
    img { display: block; max-width: 100%; height: auto; margin: 1.5rem auto; border-radius: 6px; }
    code { padding: .15em .35em; background: var(--code); border-radius: 4px; font: .88em/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
    pre { overflow: auto; padding: 1rem 1.15rem; background: var(--code); border: 1px solid var(--border); border-radius: 7px; }
    pre code { padding: 0; background: none; }
    blockquote { margin-left: 0; padding: .1rem 1rem; color: var(--muted); border-left: 4px solid var(--quote); }
    blockquote > :last-child { margin-bottom: 0; }
    li + li { margin-top: .3em; }
    .task { list-style: none; }
    .task input { margin-left: -1.4rem; }
    hr { height: 1px; margin: 2.5rem 0; border: 0; background: var(--border); }
    .table-wrap { max-width: 100%; margin-bottom: 1.25rem; overflow-x: auto; }
    table { width: 100%; border-spacing: 0; border-collapse: collapse; font-size: .94rem; }
    th, td { padding: .55rem .75rem; border: 1px solid var(--border); }
    th { background: var(--code); }
    .toc { margin: 0 0 3rem; padding: 1rem 1.25rem; border: 1px solid var(--border); border-radius: 7px; background: var(--code); }
    .toc ol { margin: .5rem 0 0; padding-left: 1.4rem; }
    .toc li { margin: .1rem 0; }
    .toc .level-3, .toc .level-4, .toc .level-5, .toc .level-6 { margin-left: 1rem; font-size: .92em; }
    @media print {
      :root { --bg: #fff; --paper: #fff; --text: #000; --muted: #444; --border: #bbb; --code: #f4f4f4; }
      .page { width: 100%; padding: 0; box-shadow: none; }
      .toc { break-inside: avoid; }
      .reader-actions { display: none; }
      a { color: inherit; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="reader-bar">
      <div class="source">Rendered from {{SOURCE_NAME}}</div>
      <div class="reader-actions">
        <button id="view-toggle" type="button" aria-controls="rendered-view raw-view" aria-pressed="false">View raw</button>
        <button id="copy-markdown" type="button" hidden>Copy Markdown</button>
      </div>
    </header>
    <div id="rendered-view">
      {{TOC}}
      <article>{{CONTENT}}</article>
    </div>
    <section id="raw-view" class="raw-view" aria-label="Raw Markdown" hidden>
      <pre><code id="raw-markdown">{{RAW_MARKDOWN}}</code></pre>
    </section>
  </main>
  <script>
    (() => {
      const toggle = document.getElementById("view-toggle");
      const copy = document.getElementById("copy-markdown");
      const rendered = document.getElementById("rendered-view");
      const raw = document.getElementById("raw-view");
      const source = document.getElementById("raw-markdown").textContent;
      let rawVisible = false;

      toggle.addEventListener("click", () => {
        rawVisible = !rawVisible;
        rendered.hidden = rawVisible;
        raw.hidden = !rawVisible;
        copy.hidden = !rawVisible;
        toggle.textContent = rawVisible ? "View rendered" : "View raw";
        toggle.setAttribute("aria-pressed", String(rawVisible));
      });

      copy.addEventListener("click", async () => {
        let copied = false;
        try {
          await navigator.clipboard.writeText(source);
          copied = true;
        } catch {
          const field = document.createElement("textarea");
          field.value = source;
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          copied = document.execCommand("copy");
          field.remove();
        }
        const label = copied ? "Copied!" : "Copy failed";
        copy.textContent = label;
        setTimeout(() => { copy.textContent = "Copy Markdown"; }, 1500);
      });
    })();
  </script>
</body>
</html>
